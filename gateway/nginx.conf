worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Structured JSON access log so the OTel Collector can ship gateway
    # request logs alongside the application logs.
    log_format json_combined escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"request_id":"$request_id",'
        '"host":"$host"'
        '}';

    access_log /dev/stdout json_combined;
    error_log  /dev/stderr warn;

    sendfile        on;
    keepalive_timeout 65;

    upstream order_service {
        server order-service:8082;
    }

    upstream payment_service {
        server payment-service:8083;
    }

    upstream fraud_service {
        server fraud-service:8084;
    }

    upstream notification_service {
        server notification-service:8085;
    }

    server {
        listen 80;
        server_name _;

        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        location /api/orders {
            proxy_pass http://order_service;
        }

        location /api/payments {
            proxy_pass http://payment_service;
        }

        location /api/fraud-checks {
            proxy_pass http://fraud_service;
        }

        location /api/notifications {
            proxy_pass http://notification_service;
        }

        # Lightweight gateway health check
        location /healthz {
            access_log off;
            return 200 '{"status":"ok"}';
            default_type application/json;
        }

        # Scraped by nginx-exporter (container-internal only)
        location /stub_status {
            stub_status;
            access_log off;
            allow all;
        }
    }
}
