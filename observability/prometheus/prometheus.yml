global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alert-rules.yml

# Long-term storage: forward everything scraped to VictoriaMetrics as well
# as keeping Prometheus's own local TSDB for alert evaluation.
remote_write:
  - url: http://victoriametrics:8428/api/v1/write

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['order-service:8082']
        labels:
          application: order-service

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['payment-service:8083']
        labels:
          application: payment-service

  - job_name: fraud-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['fraud-service:8084']
        labels:
          application: fraud-service

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['notification-service:8085']
        labels:
          application: notification-service

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']

  - job_name: postgres-exporter
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: nginx-exporter
    static_configs:
      - targets: ['nginx-exporter:9113']
