version: "3.9"

x-app-env: &app-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: ${POSTGRES_USER:-postgres}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces

networks:
  observability-platform:
    driver: bridge

volumes:
  postgres-data:
  victoriametrics-data:
  victorialogs-data:
  tempo-data:
  grafana-data:
  prometheus-data:
  alertmanager-config:

services:
  # ---------------------------------------------------------------------
  # Data layer
  # ---------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [observability-platform]

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/postgres?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [observability-platform]

  # ---------------------------------------------------------------------
  # Microservices
  # ---------------------------------------------------------------------
  order-service:
    build: ./microservices/order
    ports:
      - "8082:8082"
    environment:
      <<: *app-env
      DB_NAME: orderdb
      PAYMENT_SERVICE_URL: http://payment-service:8083
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks: [observability-platform]

  payment-service:
    build: ./microservices/payment
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: ${PAYMENT_SERVICE_PROFILE:-default}
      <<: *app-env
      DB_NAME: paymentdb
      FRAUD_SERVICE_URL: http://fraud-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
    depends_on:
      postgres:
        condition: service_healthy
    networks: [observability-platform]

  fraud-service:
    build: ./microservices/fraud
    ports:
      - "8084:8084"
    environment:
      <<: *app-env
      DB_NAME: frauddb
    depends_on:
      postgres:
        condition: service_healthy
    networks: [observability-platform]

  notification-service:
    build: ./microservices/notification
    ports:
      - "8085:8085"
    environment:
      <<: *app-env
      DB_NAME: notificationdb
    depends_on:
      postgres:
        condition: service_healthy
    networks: [observability-platform]

  # ---------------------------------------------------------------------
  # API Gateway
  # ---------------------------------------------------------------------
  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - order-service
      - payment-service
      - fraud-service
      - notification-service
    networks: [observability-platform]

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    command:
      - -nginx.scrape-uri=http://gateway/stub_status
    depends_on:
      - gateway
    networks: [observability-platform]

  # ---------------------------------------------------------------------
  # Telemetry pipeline
  # ---------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # collector self-metrics
    depends_on:
      - tempo
      - victorialogs
    networks: [observability-platform]

  prometheus:
    image: prom/prometheus:v2.55.0
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    ports:
      - "9090:9090"
    depends_on:
      - alertmanager
    networks: [observability-platform]

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.102.0
    command:
      - --storageDataPath=/storage
      - --retentionPeriod=90d
    volumes:
      - victoriametrics-data:/storage
    ports:
      - "8428:8428"
    networks: [observability-platform]

  victorialogs:
    image: victoriametrics/victoria-logs:v0.28.0-victorialogs
    command:
      - --storageDataPath=/storage
    volumes:
      - victorialogs-data:/storage
    ports:
      - "9428:9428"
    networks: [observability-platform]

  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    networks: [observability-platform]

  # Renders the Alertmanager config template with real secrets from .env
  # before Alertmanager starts (Alertmanager itself doesn't expand env vars).
  alertmanager-config-init:
    image: alpine:3.20
    command: >
      sh -c "apk add --no-cache gettext >/dev/null &&
             envsubst < /template/alertmanager.yml.template > /config/alertmanager.yml"
    volumes:
      - ./observability/alertmanager:/template:ro
      - alertmanager-config:/config
    environment:
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.example.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-alerts@example.com}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-oncall@example.com}
    networks: [observability-platform]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - alertmanager-config:/etc/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    depends_on:
      - alertmanager-config-init
    networks: [observability-platform]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_INSTALL_PLUGINS: victoriametrics-logs-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - victoriametrics
      - tempo
      - victorialogs
    networks: [observability-platform]

  # ---------------------------------------------------------------------
  # Infrastructure metrics (container CPU/mem/network/storage)
  # ---------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8081:8080"
    privileged: true
    networks: [observability-platform]
