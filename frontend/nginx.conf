server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the SPA and proxy API calls on one origin so browser requests need no cross-origin credentials policy.
    location /api/ {
        proxy_pass http://gateway:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routes (for example, /login) must resolve to the React entry point after a reload.
    location / {
        try_files $uri $uri/ /index.html;
    }
}